<html>
	<head>
		<title>Dashcam Ingest Manager</title>
	</head>
	<body>
		<h1>Dashcam Ingest Manager</h1>
		<h2>Registered dashcams</h2>
		<table>
      <tr><th>IP</th><th>User</th><th>Ingest Directory</th><th>Actions</th></tr>
			{% for dashcam in dashcams %}
      <tr><td>{{dashcam[0]}}</td><td>{{dashcam[1]}}</td><td>{{dashcam[3]}}</td><td><a href="dashcam/delete/{{dashcam[0]}}">Delete</a><a href="dashcam/update/{{dashcam[0]}}">Update</a></tr>
			{% endfor %}
		</table>
	</body>
</html>
